name: Publish to PyPI

# - Publishing a GitHub release  -> tests, build and upload to PyPI
# - Running the workflow by hand -> tests, build and upload to TestPyPI (dry run)
#
# Uses PyPI "Trusted Publishing" (OIDC): no API token is stored in GitHub.
# One-time setup is described in RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The tests only need pandas: torch, xgboost, ... are not installed here.
      - name: Install package (without heavy dependencies) and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install pandas pytest
      - name: Run tests
        run: python -m pytest -q tests

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import glob, os, re
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel = glob.glob("dist/*.whl")[0]
          version = re.match(r"dist/esmrank-([^-]+)-", wheel).group(1)
          assert version == tag, f"release tag {tag!r} does not match package version {version!r}"
          print(f"OK: releasing esmrank {version}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/esmrank/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # dry runs can be repeated for the same version

  publish-pypi:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/esmrank/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
